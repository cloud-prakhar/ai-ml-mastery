# Conda alternative to requirements.txt.
#   conda env create -f environment.yml
#   conda activate ai-ml-mastery
#
# venv + pip is taught first in module 00 because it needs no extra install.
# Use this if you already work in Conda, or if you are on Windows and hit
# compiler errors installing scientific packages with pip.
name: ai-ml-mastery
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.1.3
  - pandas=2.2.3
  - scipy=1.14.1
  - scikit-learn=1.5.2
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - jupyterlab=4.3.1
  - ipykernel=6.29.5
  - ipywidgets=8.1.5
  - pyyaml=6.0.2
  - requests=2.32.3
  - tqdm=4.67.0
  - pip
  - pip:
      - plotly==5.24.1
      - python-dotenv==1.0.1
