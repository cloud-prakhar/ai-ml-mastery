name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly external link check. Documentation URLs rot silently, and we would
    # rather find out from a scheduled run than from a learner hitting a 404.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate internal Markdown links
        run: python scripts/check_links.py

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --requirement requirements.txt
        continue-on-error: true # advisory: a new CVE should not block a docs fix

      - name: Verify the learner setup script runs
        run: python scripts/verify_setup.py

  external-links:
    # Network checks are slow and depend on third-party availability, so they run
    # on a schedule and on demand - never as a gate on an ordinary pull request.
    # A documentation host having a bad day must not block a typo fix.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: HTTP-check every external URL
        run: python scripts/check_links.py --external
